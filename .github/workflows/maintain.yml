name: Maintain VPS

on:
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          ansible_user: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VPS_IP: ${{ vars.VPS_IP }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
