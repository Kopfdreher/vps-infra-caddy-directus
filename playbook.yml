---
- name: Caddy x DirectusCMS VPS Infra
  hosts: webservers
  become: true

  vars:
    app_dir: "/home/deploy/vps-infra"
    frontend_dir: "/var/www/frontend-main"
    vps_ip: "{{ ansible_host }}"
    admin_email: "admin@yourdomain.com"
    admin_password: ""

  tasks:
    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        create_home: true

    - name: Install SSH public key for deploy
      ansible.posix.authorized_key:
        user: deploy
        state: present
        key: "{{ lookup('file', '~/.ssh/hetzner_deploy.pub') }}"

    - name: Allow deploy passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Ensure 1GB Swap File Exists
      ansible.builtin.command:
        cmd: fallocate -l 1G /swapfile
        creates: /swapfile

    - name: Set Swap Permissions
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'

    - name: Format Swap File
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: ansible_facts.swaptotal_mb == 0

    - name: Enable Swap File
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: ansible_facts.swaptotal_mb == 0

    - name: Add Swap to /etc/fstab
      ansible.builtin.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
    - name: Configure official Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install System Dependencies
      ansible.builtin.apt:
        name:
          - curl
          - git
          - openssl
          - ufw
          - fail2ban
          - uidmap
          - slirp4netns
          - docker-ce
          - docker-ce-cli
          - docker-ce-rootless-extras
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Allow Unprivileged Port Binding (80/443 for Rootless Docker)
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: '80'
        state: present
        reload: yes

    - name: Configure UFW Firewall Rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22", proto: tcp }
        - { port: "80", proto: tcp }
        - { port: "443", proto: tcp }
        - { port: "443", proto: udp }

    - name: Enable UFW Firewall
      community.general.ufw:
        state: enabled
        default: deny

    - name: Harden SSH via drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          KbdInteractiveAuthentication no
      notify: Reload SSH Services

    - name: Validate sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Ensure Directories Exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ frontend_dir }}"
        - "{{ app_dir }}/secrets"
        - "{{ app_dir }}/database"
        - "{{ app_dir }}/uploads"

    - name: Give deploy ownership of Directus data
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: deploy
        group: deploy
        recurse: true
      loop:
        - "{{ app_dir }}/database"
        - "{{ app_dir }}/uploads"

    - name: Generate Directus Key
      ansible.builtin.shell:
        cmd: "openssl rand -hex 32 > {{ app_dir }}/secrets/directus_key.txt"
        creates: "{{ app_dir }}/secrets/directus_key.txt"

    - name: Generate Directus Secret
      ansible.builtin.shell:
        cmd: "openssl rand -hex 32 > {{ app_dir }}/secrets/directus_secret.txt"
        creates: "{{ app_dir }}/secrets/directus_secret.txt"

    - name: Install provided admin password
      ansible.builtin.copy:
        content: "{{ admin_password }}"
        dest: "{{ app_dir }}/secrets/admin_password.txt"
        owner: deploy
        group: deploy
        mode: "0600"
        force: false
      when: admin_password | length > 0

    - name: Generate admin password when none was provided
      ansible.builtin.shell:
        cmd: "openssl rand -hex 16 | tr -d '\\n' > {{ app_dir }}/secrets/admin_password.txt"
        creates: "{{ app_dir }}/secrets/admin_password.txt"
      when: admin_password | length == 0

    - name: Set secret directory permissions
      ansible.builtin.file:
        path: "{{ app_dir }}/secrets"
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Set secret file permissions
      ansible.builtin.file:
        path: "{{ app_dir }}/secrets/{{ item }}"
        owner: deploy
        group: deploy
        mode: "0600"
      loop:
        - directus_key.txt
        - directus_secret.txt
        - admin_password.txt

    - name: Install Compose project files
      ansible.builtin.copy:
        src: compose/docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: deploy
        group: deploy
        mode: "0644"

    - name: Install environment file
      ansible.builtin.template:
        src: compose/env.j2
        dest: "{{ app_dir }}/.env"
        owner: deploy
        group: deploy
        mode: "0640"

    - name: Install Caddyfile
      ansible.builtin.template:
        src: compose/Caddyfile.j2
        dest: "{{ app_dir }}/Caddyfile"
        owner: deploy
        group: deploy
        mode: "0644"

    - name: Read deploy account
      ansible.builtin.getent:
        database: passwd
        key: deploy

    - name: Keep deploy user services running without a login
      ansible.builtin.command: loginctl enable-linger deploy
      args:
        creates: /var/lib/systemd/linger/deploy

    - name: Start deploy user systemd
      ansible.builtin.systemd:
        name: "user@{{ getent_passwd.deploy[1] }}"
        state: started
        scope: system

    - name: Stop system-wide Docker
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - docker.socket
        - docker.service

    - name: Install rootless Docker for deploy
      become_user: deploy
      ansible.builtin.command: dockerd-rootless-setuptool.sh install
      args:
        creates: /home/deploy/.config/systemd/user/docker.service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.deploy[1] }}"

    - name: Clear failed rootless Docker state
      become_user: deploy
      ansible.builtin.command: systemctl --user reset-failed docker.service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.deploy[1] }}"
      changed_when: false
      failed_when: false

    - name: Start rootless Docker
      become_user: deploy
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.deploy[1] }}"

    - name: Start Caddy and Directus
      become_user: deploy
      ansible.builtin.command: /usr/bin/docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.deploy[1] }}"
        DOCKER_HOST: "unix:///run/user/{{ getent_passwd.deploy[1] }}/docker.sock"
      register: compose_up
      changed_when: compose_up.stdout is search('Started|Recreated|Creating|Pulling')

  handlers:
    - name: Reload SSH Services
      ansible.builtin.service:
        name: ssh
        state: reloaded
